name: Probe live site

# Ruční diagnostika nasazeného webu. Ze sandboxu, ve kterém vyvíjím, není
# github.io ani api.github.com dosažitelné (proxy vrací 403), takže jediný
# způsob, jak se podívat na to, co uživatel opravdu vidí, je runner.
#
# Řeší dvě konkrétní stížnosti: "data jsou stará 5 hodin" a "neurčí polohu".
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
      deployments: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm install

      - run: npx playwright install --with-deps chromium

      - name: Sonda v prohlížeči (stáří dat + geolokace)
        run: node tests/probe_live.mjs

      # Záměrně až na konci: instalace Chromia vysype do logu stovky řádků,
      # a log se čte od konce. Podstatný výstup patří pod ně, ne nad ně.
      - name: Stav Pages, deploymentů a workeru
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python pipeline/probe_pages.py
