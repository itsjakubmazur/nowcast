name: Nowcast pipeline

on:
  schedule:
    # ZÁCHRANNÁ SÍŤ, ne hlavní spouštěč. Primárně triggeruje cron-job.org přes
    # workflow_dispatch; GitHub cron na free tieru chodí nespolehlivě a pozdě.
    #
    # Bývalo tu */10, což se ukázalo jako aktivní škoda. Skupina concurrency
    # drží nejvýš JEDEN čekající běh a každý nový trigger ten čekající ZRUŠÍ —
    # i když jeho job už stojí ve frontě na runnera. Když se runner shání
    # deset patnáct minut a trigger chodí po pěti, čekající běh se nikdy
    # nedočká: pokaždé ho sejme mladší. Přesně to bylo vidět 6. 8. 2026, kdy
    # job 92681019806 čekal patnáct minut s runner_id 0 a pak byl zrušen.
    #
    # Půlhodinová záloha se s pětiminutovým externím cronem pere šestkrát méně
    # a pořád splní, k čemu tu je — nastartovat pipeline, když externí cron
    # umře.
    - cron: '*/30 * * * *'
  workflow_dispatch:  # trigger z externího cronu (cron-job.org) nebo ruční spuštění
    inputs:
      mode:
        description: 'auto = full/fast střídavě podle minuty, full = vše, fast = jen radarová dráha'
        required: false
        default: 'auto'
        type: choice
        options: [auto, full, fast]

# Zabrání hromadění běhů — nový run zruší čekající, ne běžící.
#
# Za jménem je pořadové číslo, a to je záměr, ne ozdoba. 6. 8. 2026 uvízl běh
# 31123794617 ve stavu "waiting" (čekal na prostředí github-pages, viz
# komentář u run-pipeline) a v tom stavu ho nešlo zrušit ani přes API
# (500/502), ani přes web (timeout při načtení stránky běhu). Jenže dokud
# visel, držel slot celé skupiny a nepustil za sebe NIC — od 15:35 UTC se
# nepublikovalo.
#
# Změna jména skupiny je jediná páka, která je čistě v repu: nové běhy padnou
# do jiné skupiny, takže je zaseknutý běh v té staré nebrzdí. Zůstane viset,
# ale sám, a časem ho GitHub uklidí.
#
# Kdyby se to opakovalo, číslo se zvedne. Ne že by to bylo elegantní — je to
# nouzový východ pro stav, ze kterého jiné dveře nevedou.
concurrency:
  group: nowcast-pipeline-2
  cancel-in-progress: false

jobs:
  # POZOR na pokušení sloučit tenhle job s deployem do jednoho, ať běh žádá
  # o jeden runner místo dvou. Zkusil jsem to 6. 8. 2026 a je to horší:
  # prostředí github-pages pouští jeden deployment naráz, takže job, který
  # ho deklaruje, čeká ve stavu "waiting", DOKUD předchozí deployment
  # neskončí. Sloučený job tím čeká celý — deset minut výpočtů uvízne za
  # frontou na publikaci. Ve dvou jobech čeká jen ten deploy, a data se
  # mezitím spočítají.
  run-pipeline:
    runs-on: ubuntu-latest
    # Strop, aby zaseknutý běh neblokoval frontu. Zdravý full běh je po
    # odlehčení ~5 minut, s pomalými crawlery na :00 a :30 ~10 — dvacet je
    # rezerva, ne cíl.
    timeout-minutes: 20
    permissions:
      contents: write   # potřeba pro commit-back pipeline/state/ (verify.py historie)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Rychlá dráha: fast režim přeskočí stanice/verify (ušetří ~1–2 min),
      # takže radar může jet každých 5 minut. Externí cron (cron-job.org) volá
      # workflow_dispatch s mode=auto co 5 min → minuty :x0–:x4 full, :x5–:x9 fast.
      # Tři kadence, ne dvě. Fast/full samo nestačilo: full běh trval ~10 minut,
      # ale spouští se po pěti, takže se běhy začaly hromadit — GitHub pak
      # čekající rušil ("cancelled") a runner občas ani nenaskočil ("Set up job"
      # failure po třech minutách). Skoro pět z těch deseti minut spolykaly TŘI
      # crawlery s vlastním časovým rozpočtem (chmi_stats 150 s, hydro 120 s,
      # chmi_normals 120 s), které svůj rozpočet vyčerpají do dna KAŽDÝ běh.
      #
      # Nic z toho se ale nemění po minutách: rekordy a normály po měsících,
      # hlásné profily po desítkách minut. Jedou proto jen na :00 a :30 a mezi
      # tím je carry_over.py doplní z posledního nasazení — přesně na to je.
      - name: Determine mode
        id: mode
        run: |
          MODE="${{ github.event.inputs.mode || 'auto' }}"
          M=$((10#$(date -u +%M)))
          if [ "$MODE" = "auto" ]; then
            if [ $((M % 10)) -lt 5 ]; then MODE=full; else MODE=fast; fi
          fi
          # Ruční full běh smí pomalé crawlery taky — jinak by se po zásahu
          # do jejich kódu nedaly vyzkoušet jinak než čekáním na půlhodinu.
          if [ "$MODE" = "full" ] && { [ $((M % 30)) -lt 5 ] \
             || [ "${{ github.event.inputs.mode }}" = "full" ]; }; then
            SLOW=1
          else
            SLOW=0
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "slow=$SLOW" >> "$GITHUB_OUTPUT"
          echo "Režim běhu: $MODE (pomalé crawlery: $SLOW)"

      # Ve fast režimu se stanice/accuracy negenerují — obnovíme je z cache
      # posledního full běhu, ať se z publikovaného webu neztratí.
      - name: Restore station data (poslední full běh)
        uses: actions/cache/restore@v4
        with:
          path: |
            data/chmi_stations.json
            data/chmi_series_index.json
            data/chmi_series
            data/chmi_history
            data/chmi_stats.json
            data/wu_stations.json
            data/wu_history.json
            data/accuracy.json
            data/hydro.json
            data/aladin.json
            data/wind_grid.json
            data/metar_stations.json
            data/metar
            data/chmi_rain.json
            data/metar_names.json
            data/metar_history.json
            data/chmi_fct.json
            data/echotop.json
            data/chmi_normals.json
            data/chmi_forecast.json
            data/chmi_air.json
            data/chmi_regional.json
            data/chmi_aero.json
            data/chmi_air_map.json
            data/accuracy_precip.json
            data/euro_stations.json
            data/imgw_coords.json
          key: station-data-${{ github.run_id }}
          restore-keys: |
            station-data-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pipeline/requirements.txt

      - name: Install eccodes (GRIB knihovna pro ALADIN)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libeccodes0

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Run ingest (Fáze 1)
        run: python pipeline/ingest.py
        env:
          NOWCAST_LAT: '50.08'
          NOWCAST_LON: '14.42'

      - name: Run nowcast (Fáze 2)
        run: python pipeline/nowcast.py
        env:
          NOWCAST_LAT: '50.08'
          NOWCAST_LON: '14.42'

      - name: Run fuse (Fáze 3a)
        run: python pipeline/fuse.py
        env:
          NOWCAST_LAT: '50.08'
          NOWCAST_LON: '14.42'

      # Fáze 3b (AI narace) záměrně chybí — AI verdikt se teď generuje
      # per-location on-demand ve workers/narrate (Cloudflare Worker), volaný
      # přímo z frontendu pro zvolené místo a cachovaný na edge. Fixní narace
      # jedné domovské lokace tady by byla jen zbytečné volání Gemini navíc.

      - name: Run grid (Fáze 4a)
        run: python pipeline/grid.py

      - name: Run chmi_fct (COTREC nowcast ČHMÚ — nezávislý druhý názor)
        timeout-minutes: 3
        continue-on-error: true
        run: python pipeline/chmi_fct.py || echo "chmi_fct.py selhalo, pokračuji"
        env:
          NOWCAST_LAT: '50.08'
          NOWCAST_LON: '14.42'

      - name: Run echotop (výška vrcholů — hloubka konvekce)
        timeout-minutes: 2
        continue-on-error: true
        run: python pipeline/echotop.py || echo "echotop.py selhalo, pokračuji"

      - name: Run render (Fáze 4c)
        run: python pipeline/render.py

      - name: Run aladin (ČHMÚ ALADIN model — jen full běh)
        if: steps.mode.outputs.mode == 'full'
        timeout-minutes: 3
        continue-on-error: true
        run: python pipeline/aladin.py || echo "aladin.py selhalo, pokračuji bez ALADIN modelu"

      - name: Run windgrid (Fáze 4d — částice větru)
        run: python pipeline/windgrid.py || echo "windgrid.py selhalo, pokračuji bez větrné vrstvy"

      - name: Run verify (zpětná validace přesnosti nowcastu)
        if: steps.mode.outputs.mode == 'full'
        run: python pipeline/verify.py || echo "verify.py selhalo, pokračuji bez accuracy.json"
        env:
          NOWCAST_LAT: '50.08'
          NOWCAST_LON: '14.42'

      - name: Run wu (WU PWS stanice)
        if: steps.mode.outputs.mode == 'full'
        run: python pipeline/wu.py || echo "wu.py selhalo (WU_API_KEY?), pokračuji"
        env:
          WU_API_KEY: ${{ secrets.WU_API_KEY }}

      - name: Run chmi (ČHMÚ stanice + akumulace historie)
        if: steps.mode.outputs.mode == 'full'
        timeout-minutes: 5
        continue-on-error: true
        run: python pipeline/chmi.py || echo "chmi.py selhalo, pokračuji"

      - name: Run chmi_rain (srážkoměrná síť — 436 stanic)
        if: steps.mode.outputs.mode == 'full'
        timeout-minutes: 4
        continue-on-error: true
        run: python pipeline/chmi_rain.py || echo "chmi_rain.py selhalo, pokračuji"

      - name: Run euro (sousedské sítě bez klíče — SE/CH/AT/PL)
        if: steps.mode.outputs.mode == 'full'
        timeout-minutes: 3
        continue-on-error: true
        run: python pipeline/euro.py || echo "euro.py selhalo, pokračuji"

      - name: Run metar (letištní stanice — doma + světové dlaždice)
        if: steps.mode.outputs.mode == 'full'
        timeout-minutes: 3
        continue-on-error: true
        run: python pipeline/metar.py || echo "metar.py selhalo, pokračuji"

      - name: Run chmi_stats (rekordy/normály/trend — rozpočet 150 s, resume; jen :00 a :30)
        if: steps.mode.outputs.slow == '1'
        timeout-minutes: 4
        continue-on-error: true
        run: python pipeline/chmi_stats.py || echo "chmi_stats.py selhalo, pokračuji"

      - name: Run chmi_forecast (textová předpověď ČHMÚ)
        if: steps.mode.outputs.mode == 'full'
        timeout-minutes: 2
        continue-on-error: true
        run: python pipeline/chmi_forecast.py || echo "chmi_forecast.py selhalo, pokračuji"

      - name: Run chmi_air (měřená kvalita ovzduší)
        if: steps.mode.outputs.mode == 'full'
        timeout-minutes: 3
        continue-on-error: true
        run: python pipeline/chmi_air.py || echo "chmi_air.py selhalo, pokračuji"

      - name: Run chmi_aero (aerologie — CAPE/CIN z radiosondáží)
        if: steps.mode.outputs.mode == 'full'
        timeout-minutes: 2
        continue-on-error: true
        run: python pipeline/chmi_aero.py || echo "chmi_aero.py selhalo, pokračuji"

      - name: Run chmi_regional (krajské průměry 1961-dnes)
        if: steps.mode.outputs.mode == 'full'
        timeout-minutes: 3
        continue-on-error: true
        run: python pipeline/chmi_regional.py || echo "chmi_regional.py selhalo, pokračuji"

      - name: Run verify_precip (přesnost srážek proti srážkoměrům)
        if: steps.mode.outputs.mode == 'full'
        timeout-minutes: 3
        continue-on-error: true
        run: python pipeline/verify_precip.py || echo "verify_precip.py selhalo, pokračuji"

      - name: Run chmi_normals (normály 1991-2020 — statická data; jen :00 a :30)
        if: steps.mode.outputs.slow == '1'
        timeout-minutes: 4
        continue-on-error: true
        run: python pipeline/chmi_normals.py || echo "chmi_normals.py selhalo, pokračuji"

      - name: Run hydro (hlásné profily — stavy a průtoky, rozpočet 120 s; jen :00 a :30)
        if: steps.mode.outputs.slow == '1'
        timeout-minutes: 4
        continue-on-error: true
        run: python pipeline/hydro.py || echo "hydro.py selhalo, pokračuji"

      - name: Save station data cache (pro příští fast běhy)
        if: steps.mode.outputs.mode == 'full'
        uses: actions/cache/save@v4
        with:
          path: |
            data/chmi_stations.json
            data/chmi_series_index.json
            data/chmi_series
            data/chmi_stats.json
            data/wu_stations.json
            data/wu_history.json
            data/accuracy.json
            data/hydro.json
            data/aladin.json
            data/wind_grid.json
            data/metar_stations.json
            data/metar
            data/chmi_rain.json
            data/metar_names.json
            data/metar_history.json
            data/chmi_fct.json
            data/echotop.json
            data/chmi_normals.json
            data/chmi_forecast.json
            data/chmi_air.json
            data/chmi_regional.json
            data/chmi_aero.json
            data/chmi_air_map.json
            data/accuracy_precip.json
          key: station-data-${{ github.run_id }}

      # Fast běh nevyrábí stanice, ALADIN ani METAR a deploy publikuje CELÝ
      # adresář data/. Bez tohohle kroku by každý druhý deploy web o ty
      # soubory připravil — a přesně to se dělo.
      - name: Carry over (doplň z posledního nasazení, co tenhle běh nevyrobil)
        continue-on-error: true
        run: python pipeline/carry_over.py || echo "carry_over.py selhalo, pokračuji"

      - name: Validate publikovaná data (poslední pojistka před deployem)
        run: python pipeline/validate.py

      - name: Upload data artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nowcast-data-${{ github.run_id }}
          path: data/
          retention-days: 1

      - name: Copy data into web/
        run: |
          mkdir -p web/data
          cp -r data/* web/data/ 2>/dev/null || true

      # Značka publikace + stav verifikace. Značka NENÍ kosmetika, drží web živý:
      #
      # actions/deploy-pages posílá do Pages "pages_build_version", a ten se bere
      # z commit SHA běhu. Když se repo nemění, jde do Pages pořád ta samá verze
      # a GitHub ji v jednu chvíli přestane přebírat — deployment se založí,
      # ohlásí "success", vrátí i URL prostředí, ale obsah webu se nezmění.
      #
      # 30. 7. 2026 se to stalo naostro: od 07:52 do 13:45 UTC běžela pipeline po
      # pěti minutách, ~70 deployů skončilo úspěchem, a web přitom celou dobu
      # servíroval data z 07:51 (origin, ne cache — x-cache: MISS, last-modified
      # 07:56). Jakmile na main přistál nový commit, další běh se nasadil pod
      # novým SHA a web byl čerstvý do dvou minut.
      #
      # Dřív se tenhle commit dělal jen "když se změnil state", což byla shodou
      # okolností dost častá událost na to, aby SHA bylo pořád nové. Jak verify
      # přešel na full běhy, commity ustaly — a s nimi i publikace.
      #
      # Značka jde do pipeline/state/, tedy do cesty, kterou nehlídá žádný
      # workflow, a nese [skip ci], aby z ní nevznikaly další běhy.
      - name: Commit publikační značku (drží Pages deploy živý) + stav verifikace
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ run=${GITHUB_RUN_ID}" > pipeline/state/last_publish.txt
          git config user.name "nowcast-bot"
          git config user.email "actions@users.noreply.github.com"
          git add pipeline/state/
          if git diff --cached --quiet; then
            echo "Není co commitnout — neobvyklé, značka se mění každý běh."
            exit 0
          fi
          git commit -m "chore: publikační značka $(date -u +%H:%M) [skip ci]"
          # -X theirs a úklid po nezdařeném rebase: značka se mění KAŽDÝ běh a
          # běhy se překrývají (full běh trvá ~6 min, spouští se po 5), takže
          # dva runnery si přepisují tytéž soubory a prostý rebase skončí
          # konfliktem. Bez tohohle push třikrát selhal a značka vůbec
          # nepřistála — což je přesně ten stav, kvůli kterému značka vznikla.
          # Konflikt tu není informace: soubor je z definice "poslední vyhrává".
          for i in 1 2 3; do
            git rebase --abort 2>/dev/null || true
            git fetch origin "${GITHUB_REF_NAME}" \
              && git rebase -X theirs "origin/${GITHUB_REF_NAME}" \
              && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            echo "Push pokus $i selhal, zkouším znovu za $((i*3))s"
            sleep $((i * 3))
          done

  deploy-pages:
    needs: run-pipeline
    runs-on: ubuntu-latest
    # Deploye se stohovaly: actions/deploy-pages čeká, až Pages deployment
    # doběhne, a po deseti minutách to vzdá — v logu je krok "Deploy to GitHub
    # Pages" dlouhý přesně 10:06 a červený. Prostředí github-pages pustí jen
    # jeden deployment naráz, takže při běhu po pěti minutách stačí jedno
    # zdržení a fronta se přenese do dalšího běhu.
    #
    # Vlastní skupina s cancel-in-progress to řeže na správném místě: čekající
    # deploy ustoupí novějšímu. Zahodit ho nic nestojí — publikuje se celý
    # adresář data/, takže novější deploy nese všechno, co nesl ten zrušený,
    # a k tomu čerstvější radar.
    concurrency:
      group: pages
      cancel-in-progress: true
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download data artifact
        uses: actions/download-artifact@v4
        with:
          name: nowcast-data-${{ github.run_id }}
          path: web/data/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/

      # Deploy se zkouší DVAKRÁT. Ne z opatrnosti — 6. 8. 2026 v 17:41 spadl
      # po dvou vteřinách na tomhle:
      #
      #   Invalid actions OIDC token due to No keys from key endpoint match
      #   the id token, validate around 1786038105  (HTTP 400)
      #
      # Token, kterým se deploy autentizuje, byl podepsaný klíčem, který
      # ověřovací endpoint GitHubu neznal — rotace klíčů na jejich straně.
      # Pipeline přitom celá prošla, takže o data se přišlo jen kvůli tomu
      # poslednímu kroku a web zůstal viset na starých.
      #
      # Proti přechodné nekonzistenci pomáhá jediné: požádat o token znovu
      # o chvíli později.
      - name: Deploy to GitHub Pages
        id: deployment
        timeout-minutes: 8
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Deploy to GitHub Pages (druhý pokus)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        timeout-minutes: 8
        uses: actions/deploy-pages@v4
