name: Nowcast pipeline

on:
  schedule:
    # GitHub free tier cron je nespolehlivý — primárně triggerujeme přes cron-job.org → workflow_dispatch
    - cron: '*/10 * * * *'
  workflow_dispatch:  # trigger z externího cronu (cron-job.org) nebo ruční spuštění

# Zabrání hromadění běhů — nový run zruší čekající, ne běžící
concurrency:
  group: nowcast-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Run ingest (Fáze 1)
        run: python pipeline/ingest.py
        env:
          NOWCAST_LAT: '50.08'
          NOWCAST_LON: '14.42'

      - name: Run nowcast (Fáze 2)
        run: python pipeline/nowcast.py
        env:
          NOWCAST_LAT: '50.08'
          NOWCAST_LON: '14.42'

      - name: Run fuse (Fáze 3a)
        run: python pipeline/fuse.py
        env:
          NOWCAST_LAT: '50.08'
          NOWCAST_LON: '14.42'

      - name: Run narrate (Fáze 3b)
        run: python pipeline/narrate.py || echo "narrate.py selhalo (Gemini API?), pokračuji bez narace"
        env:
          NOWCAST_LAT: '50.08'
          NOWCAST_LON: '14.42'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Run grid (Fáze 4a)
        run: python pipeline/grid.py

      - name: Run render (Fáze 4c)
        run: python pipeline/render.py

      - name: Run wu (WU PWS stanice)
        run: python pipeline/wu.py || echo "wu.py selhalo (WU_API_KEY?), pokračuji"
        env:
          WU_API_KEY: ${{ secrets.WU_API_KEY }}

      - name: Run chmi (ČHMÚ stanice + akumulace historie)
        run: python pipeline/chmi.py || echo "chmi.py selhalo, pokračuji"

      - name: Upload data artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nowcast-data-${{ github.run_id }}
          path: data/
          retention-days: 1

      - name: Copy data into web/
        run: |
          mkdir -p web/data
          cp -r data/* web/data/ 2>/dev/null || true

  deploy-pages:
    needs: run-pipeline
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download data artifact
        uses: actions/download-artifact@v4
        with:
          name: nowcast-data-${{ github.run_id }}
          path: web/data/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
