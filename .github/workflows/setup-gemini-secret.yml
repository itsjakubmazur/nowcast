name: (Dočasné) Nastav GEMINI_API_KEY na workeru

# Jednorázový pomocný workflow — přepošle existující GitHub secret
# GEMINI_API_KEY (dřív používaný pipeline/narrate.py) jako Cloudflare Worker
# secret pro nowcast-narrate, ať se AI verdikt konečně zapne. Po použití
# se smaže. Hodnota nikde neprochází přes chat ani terminál.

on:
  workflow_dispatch:

jobs:
  set-secret:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/narrate
    steps:
      - uses: actions/checkout@v4

      - name: Ověř, že GitHub secret GEMINI_API_KEY existuje
        run: |
          LEN=$(printf '%s' "$KEY" | wc -c)
          echo "Délka GEMINI_API_KEY (GitHub secret): $LEN znaků"
          if [ "$LEN" -eq 0 ]; then
            echo "::error::GitHub secret GEMINI_API_KEY neexistuje nebo je prázdný. Nastav ho v Settings → Secrets and variables → Actions → New repository secret, pak spusť tenhle workflow znovu."
            exit 1
          fi
        env:
          KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Nastav GEMINI_API_KEY jako Cloudflare Worker secret
        run: echo "$KEY" | npx wrangler secret put GEMINI_API_KEY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          KEY: ${{ secrets.GEMINI_API_KEY }}
