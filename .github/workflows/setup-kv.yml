name: (Dočasné) Vytvoř KV namespace pro Web Push

# Jednorázový pomocný workflow — vytvoří Cloudflare KV namespace potřebný
# pro Web Push subscriptions a vypíše jeho ID do logu, ať ho nemusí nikdo
# spouštět lokálně přes wrangler CLI. Po použití se smaže.

on:
  workflow_dispatch:

jobs:
  create-kv:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/narrate
    steps:
      - uses: actions/checkout@v4

      - name: Diagnostika — délka a tvar CF_API_TOKEN (bez odhalení hodnoty)
        run: |
          LEN=$(printf '%s' "$CF_TOK" | wc -c)
          echo "Délka tokenu: $LEN znaků"
          echo "Prvních 4 znaky: $(printf '%s' "$CF_TOK" | cut -c1-4)"
          echo "Posledních 4 znaky: $(printf '%s' "$CF_TOK" | rev | cut -c1-4 | rev)"
          if [ "$LEN" -eq 0 ]; then echo "::error::CF_API_TOKEN je PRÁZDNÝ nebo secret neexistuje"; fi
        env:
          CF_TOK: ${{ secrets.CF_API_TOKEN }}

      - name: Ověř autentizaci (wrangler whoami)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          workingDirectory: workers/narrate
          command: whoami

      - name: Vytvoř produkční KV namespace
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          workingDirectory: workers/narrate
          command: kv namespace create SUBSCRIPTIONS

      - name: Vytvoř preview KV namespace
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          workingDirectory: workers/narrate
          command: kv namespace create SUBSCRIPTIONS --preview
