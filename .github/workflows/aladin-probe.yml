name: ALADIN probe

# Diagnostická sonda struktury ČHMÚ ALADIN GRIB dat (opendata.chmi.cz).
# Dočasné — jakmile podle logu napíšu parser, tenhle workflow smažu.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libeccodes0 libeccodes-tools
          pip install requests eccodes
      - name: Probe ALADIN
        run: python pipeline/aladin.py
