name: Pipeline syntax check

on:
  push:
    branches: [main]
    paths: ["pipeline/**", "tests/test_*.py"]
  pull_request:
    paths: ["pipeline/**", "tests/test_*.py"]
  workflow_dispatch:

jobs:
  compile-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Byte-compile všechny pipeline moduly (rychlá syntax kontrola)
        run: python -m py_compile pipeline/*.py

      - name: Install deps pro unit testy
        run: pip install requests numpy h5py pyproj

      - name: Unit testy pipeline (windgrid — slepení děr, práh zápisu)
        run: python tests/test_windgrid.py

      - name: Unit testy pipeline (metar — dlaždice světových stanic)
        run: python tests/test_metar.py

      - name: Unit testy pipeline (buoys — sloupcový text NDBC)
        run: python tests/test_buoys.py

      - name: Unit testy pipeline (chmi_fct + echotop — geometrie a jednotky)
        run: python tests/test_chmi_fct.py

      - name: Unit testy pipeline (chmi_extra — parsery nekonzistentních CSV)
        run: python tests/test_chmi_extra.py

      - name: Unit testy pipeline (verify_precip — CSI/POD/FAR srážek)
        run: python tests/test_verify_precip.py

      - name: Unit testy pipeline (carry_over — meze stáří přenášených dat)
        run: python tests/test_carry_over.py
