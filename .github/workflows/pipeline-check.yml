name: Pipeline syntax check

on:
  push:
    branches: [main]
    paths: ["pipeline/**"]
  pull_request:
    paths: ["pipeline/**"]
  workflow_dispatch:

jobs:
  compile-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Byte-compile všechny pipeline moduly (rychlá syntax kontrola)
        run: python -m py_compile pipeline/*.py
