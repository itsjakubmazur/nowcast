name: Probe station sources

# Ruční diagnostika: co je z runneru dosažitelné a kolik stanic to přidá.
# Záměrně jen workflow_dispatch — nepatří to do pravidelné pipeline.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: pdftotext (na čtení oficiálního popisu dat ČHMÚ)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Sonda zdrojů meteostanic
        run: python pipeline/probe_stations.py
